packages:
  - .

# Security fixes pinned within existing major lines, with scoped pre-1.0
# esbuild/sharp updates checked against upstream API changes and local consumers.
# Keep separate selectors for brace-expansion's two APIs.
overrides:
  'brace-expansion@1': 1.1.21
  'brace-expansion@5': 5.0.12
  'fast-uri@3': 3.1.9
  'image-size@2': 2.0.3
  'js-yaml@4': 4.3.2
  'source-map-js@1': 1.2.2
  'undici@7': 7.30.1
  'ws@8': 8.21.0
  'zod@4': 4.6.6
  'esbuild@0.27': 0.28.2
  'sharp@0.34': 0.35.5

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
  - workerd
